name: Build 360Launcher

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # ── Checkout with full tag history so ref_name is always populated ──
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ── Resolve version: tag on tag-push, "dev-<sha>" on manual dispatch ──
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($v) -or $v -eq "main" -or $v -eq "master") {
            $v = "dev-$("${{ github.sha }}".Substring(0,7))"
          }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $v"

      # ── Clone Flarial bases ──────────────────────────────────────────────
      - name: Clone Flarial dll-oss base
        run: git clone --depth 1 https://github.com/flarialmc/dll-oss.git dll
        shell: bash

      - name: Clone Flarial launcher base
        run: git clone --depth 1 https://github.com/flarialmc/launcher.git launcher-base
        shell: bash

      # ── Generate AssemblyVersion.cs (required by .csproj) ───────────────
      - name: Generate AssemblyVersion.cs
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          # Strip leading 'v' and non-numeric chars for .NET version quad (e.g. v1.2.3 -> 1.2.3.0)
          $dotnet = $v -replace '^v','' -replace '[^0-9.]',''
          $parts  = $dotnet.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $quad   = ($parts[0..3]) -join '.'
          $content = @"
using System.Reflection;
[assembly: AssemblyVersion("$quad")]
[assembly: AssemblyFileVersion("$quad")]
[assembly: AssemblyInformationalVersion("$v")]
"@
          # Write next to the other source files; .csproj references it as ..\AssemblyVersion.cs
          $dst = "launcher-base\src\AssemblyVersion.cs"
          Set-Content $dst $content
          Write-Host "AssemblyVersion.cs -> $quad  ($v)"

      # ── Overlay our launcher files ───────────────────────────────────────
      - name: Overlay launcher files
        shell: pwsh
        run: |
          $dst = "launcher-base\src\Flarial.Launcher"
          New-Item -Force -ItemType Directory "$dst\Runtime" | Out-Null
          Copy-Item -Force "Launcher360.cs"          "$dst\Launcher360.cs"
          Copy-Item -Force "Flarial.Launcher.csproj" "$dst\Flarial.Launcher.csproj"

      # ── Overlay our client files ─────────────────────────────────────────
      - name: Overlay client files
        shell: pwsh
        run: |
          $base = "dll\src"
          # Header goes into Engine directory
          Copy-Item -Force "360Client.hpp" "$base\Client\GUI\Engine\360Client.hpp"
          # All module implementations in one compiled unit
          $mod = "$base\Client\Module\Modules"
          Copy-Item -Force "360Client.cpp" "$mod\360Client_All.cpp"

      # ── Patch fmt GIT_TAG master -> main ────────────────────────────────
      - name: Patch fmt branch in CMakeLists
        shell: python
        run: |
          import re

          path = "dll/CMakeLists.txt"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          patched = re.sub(
              r'(GIT_REPOSITORY\s+https://github\.com/fmtlib/fmt\.git\s+GIT_TAG\s+)master',
              r'\1main',
              content
          )

          if patched == content:
              print("INFO: fmt GIT_TAG pattern not found or already fixed")
          else:
              print("SUCCESS: Patched fmt GIT_TAG master -> main")

          with open(path, "w", encoding="utf-8") as f:
              f.write(patched)

          print("GIT_TAG lines after patch:")
          for i, line in enumerate(patched.splitlines(), 1):
              if "GIT_TAG" in line:
                  print(f"  Line {i}: {line.strip()}")

      # ── Patch EngineCore.hpp to include our header ───────────────────────
      - name: Patch EngineCore.hpp
        shell: pwsh
        run: |
          $f = "dll\src\Client\GUI\Engine\EngineCore.hpp"
          $c = Get-Content $f -Raw
          if ($c -notmatch [regex]::Escape('360Client.hpp')) {
            $c = "#include `"360Client.hpp`"`n" + $c
            Set-Content $f $c -NoNewline
            Write-Host "Patched EngineCore.hpp"
          } else {
            Write-Host "EngineCore.hpp already includes 360Client.hpp"
          }

      # ── Register our modules in Manager.cpp ─────────────────────────────
      #
      #   Two bugs fixed here vs all previous attempts:
      #
      #   BUG A — Unity build redefinition (C2011):
      #     Flarial uses a CMake unity build that merges all .cpp files into
      #     one translation unit.  Adding  #include "360Client_All.cpp"  to
      #     Manager.cpp caused the classes to be defined twice (once from the
      #     direct include, once when the unity blob compiled the file again).
      #     Fix: do NOT include the .cpp.  Instead add forward declarations
      #     and let CMake discover the file automatically (it already does,
      #     because the file lives inside the scanned Modules/ tree).
      #
      #   BUG B — Wrong insertion point / 'modules' undeclared (C2065):
      #     Flarial uses addModule<T>() not modules.push_back(new T()).
      #     Previous strategies either inserted outside any function scope
      #     (Strategy 3 fallback) or matched nothing at all.
      #     Fix: find the last  addModule<...>();  line and append after it.
      #     This is now the only strategy; if it fails the step prints the
      #     file so you can diagnose, then exits non-zero.
      - name: Register modules in Manager.cpp
        shell: python
        run: |
          import re, sys

          path = r"dll\src\Client\Module\Manager.cpp"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if "RenderOptions360" in content:
              print("Modules already registered, skipping.")
              sys.exit(0)

          # ── Forward-declare our classes so Manager.cpp can call addModule<T>
          #    without seeing a full definition (the unity build handles the rest).
          fwd = (
              "\n// 360Client forward declarations\n"
              "class RenderOptions360;\n"
              "class Fullbright360;\n"
              "class EntityCuller360;\n"
              "class RenderOptimizer360;\n"
          )

          # Insert forward declarations right before the first #include or at top
          first_inc = content.find('#include')
          if first_inc == -1:
              first_inc = 0
          content = content[:first_inc] + fwd + content[first_inc:]

          # ── Find the last addModule<...>() call — Flarial's registration pattern
          last_match = None
          for m in re.finditer(r'(?m)^[ \t]*addModule<[^>]+>\(\)[^;]*;[ \t]*$', content):
              last_match = m

          if last_match is None:
              # Fallback: any line that looks like a template module call
              for m in re.finditer(r'(?m)^[ \t]*\w+<[^>]+>\([^)]*\)\s*;[ \t]*$', content):
                  last_match = m

          if last_match is None:
              print("ERROR: Could not find any addModule<T>() call in Manager.cpp.")
              print("First 4000 chars of file:")
              print(content[:4000])
              sys.exit(1)

          # Insert our four registrations immediately after the last addModule line
          insert_pos = last_match.end()
          if insert_pos < len(content) and content[insert_pos] == '\n':
              insert_pos += 1

          our_calls = (
              "    addModule<RenderOptions360>();\n"
              "    addModule<Fullbright360>();\n"
              "    addModule<EntityCuller360>();\n"
              "    addModule<RenderOptimizer360>();\n"
          )
          content = content[:insert_pos] + our_calls + content[insert_pos:]

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"Inserted after: '{last_match.group().strip()}'")
          print("Successfully registered RenderOptions360, Fullbright360, EntityCuller360, RenderOptimizer360")

      # ── Build the DLL (C++) ──────────────────────────────────────────────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build DLL
        shell: pwsh
        run: |
          cmake -B dll/build -S dll `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_BUILD_TYPE=Release

          cmake --build dll/build --config Release --parallel

      # ── Embed the built DLL into the launcher resources ──────────────────
      - name: Embed DLL
        shell: pwsh
        run: |
          # Sort by date descending and skip CRT redistributables
          $candidates = Get-ChildItem "dll/build/Release" -Filter "*.dll" |
                        Where-Object { $_.Name -notmatch '^(msvcp|vcruntime|ucrtbase)' } |
                        Sort-Object LastWriteTime -Descending

          if ($candidates.Count -eq 0) {
            Write-Error "No client DLL found in dll/build/Release. Build may have failed."
            exit 1
          }

          $dll = $candidates[0]
          Write-Host "Using DLL: $($dll.FullName)"

          $res = "launcher-base\src\Flarial.Launcher\Resources"
          New-Item -Force -ItemType Directory $res | Out-Null
          Copy-Item -Force $dll.FullName "$res\360Client.dll"
          Set-Content "$res\360Client.version.txt" "${{ steps.ver.outputs.VERSION }}"
          Write-Host "Embedded as 360Client.dll  version=${{ steps.ver.outputs.VERSION }}"

      # ── Build the EXE (C#) ───────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore "launcher-base\src\Flarial.Launcher\Flarial.Launcher.csproj"

      - name: Build EXE
        shell: pwsh
        run: |
          dotnet publish "launcher-base\src\Flarial.Launcher\Flarial.Launcher.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:AssemblyName=360Launcher `
            -o out

          if (-not (Test-Path "out\360Launcher.exe")) {
            Write-Error "360Launcher.exe not found in out\ after publish."
            exit 1
          }
          Write-Host "Build succeeded: out\360Launcher.exe"

      # ── Create GitHub Release ────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "360Launcher ${{ steps.ver.outputs.VERSION }}"
          tag_name: ${{ steps.ver.outputs.VERSION }}
          files: out/360Launcher.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
